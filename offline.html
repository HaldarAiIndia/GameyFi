<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Offline | GameyFi</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,600,700,900&display=swap" rel="stylesheet">
<style>
:root {
  --primary:   #7B2FFF;
  --bg:        #08080C;
  --surface:   #0e0e14;
  --border:    #23233a;
  --border-hi: #32324d;
  --text:      #f0f0f8;
  --text-sub:  #8888aa;
  --error:     #ff4545;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh; background: var(--bg); color: var(--text);
  font-family: 'Satoshi', sans-serif; display: flex; align-items: center; justify-content: center;
  padding: 20px; overflow: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.013) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.013) 1px, transparent 1px);
  background-size: 48px 48px;
}
.card {
  width: 100%; max-width: 400px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 1.35rem; padding: 32px 24px;
  text-align: center; box-shadow: 0 24px 80px rgba(0,0,0,0.85); position: relative;
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,69,69,0.6) 50%, transparent);
}
.art-radar {
  width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 50%;
  background: rgba(255, 69, 69, 0.08); border: 1px solid rgba(255, 69, 69, 0.25);
  display: flex; align-items: center; justify-content: center; color: var(--error);
}
.art-radar svg { width: 32px; height: 32px; stroke: currentColor; fill: none; }
h1 { font-size: 1.3rem; font-weight: 900; margin-bottom: 8px; }
p { font-size: 0.82rem; color: var(--text-sub); line-height: 1.5; margin-bottom: 24px; }
.btn {
  width: 100%; padding: 13px; border-radius: 0.75rem; border: none;
  background: linear-gradient(135deg, #9B3FFF, #6615FF); color: #fff;
  font-family: inherit; font-size: 0.88rem; font-weight: 700; cursor: pointer;
  box-shadow: 0 4px 20px rgba(123,47,255,0.35); transition: opacity 0.2s;
}
.btn:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="card">
  <div class="art-radar">
    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
  </div>
  <h1>Connection Unavailable</h1>
  <p>GameyFi is operating offline. Previously cached game boards can still be launched.</p>
  <button class="btn" onclick="location.reload()">Retry Connection</button>
</div>
<script>
window.addEventListener('online', () => location.reload());
</script>
</body>
</html>
