<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181a">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Offline | GameyFi</title>
<link rel="icon" href="/favicon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#17181a;-webkit-text-size-adjust:100%}
@media(min-width:1600px){html{font-size:118%}}@media(min-width:2400px){html{font-size:150%}}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(1.25rem,env(safe-area-inset-top)) max(1.25rem,env(safe-area-inset-right)) max(1.25rem,env(safe-area-inset-bottom)) max(1.25rem,env(safe-area-inset-left));background:radial-gradient(70% 50% at 50% 0,rgba(130,170,255,.12),transparent 70%),#17181a;color:#f0f2f5;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{width:100%;max-width:28rem;background:#202225;border:1px solid #3a3d42;border-radius:16px;padding:clamp(1.5rem,5vw,2.25rem);text-align:center;box-shadow:0 25px 50px -12px rgba(0,0,0,.6);animation:pop .5s cubic-bezier(.16,1,.3,1)}
.brand{display:inline-flex;align-items:center;gap:.6rem;margin-bottom:1.25rem;color:inherit;text-decoration:none;font-weight:700;font-size:1.2rem;letter-spacing:-.02em}
.brand img{width:34px;height:34px;border-radius:10px}.brand i{font-style:normal;color:#c792ea}
h1{margin:1rem 0 .5rem;font-size:clamp(1.5rem,5vw,1.9rem);font-weight:800;letter-spacing:-.02em;line-height:1.15}
p{margin:0 0 1.5rem;color:#a8b3cf;line-height:1.6}
.row{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}
.btn{min-height:48px;padding:0 1.25rem;border:1px solid transparent;border-radius:10px;background:#82aaff;color:#17181a;font:inherit;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;text-decoration:none;cursor:pointer;transition:opacity .2s,transform .15s,background-color .2s}
.btn:hover{opacity:.9}.btn:active{transform:scale(.97)}
.btn.ghost{background:none;border-color:#3a3d42;color:#f0f2f5}.btn.ghost:hover{background:#35383c;opacity:1}
:focus-visible{outline:2px solid #82aaff;outline-offset:2px;border-radius:6px}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.art{position:relative;width:96px;height:96px;margin:0 auto;display:grid;place-items:center;color:#ff8a80}
.art .i{width:44px;height:44px;position:relative}
.art::before,.art::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,138,128,.45);animation:ring 2.4s ease-out infinite}
.art::after{animation-delay:1.2s}
@keyframes ring{from{transform:scale(.55);opacity:1}to{transform:scale(1.35);opacity:0}}
.art span{position:absolute;inset:14px;border-radius:50%;background:rgba(255,138,128,.1);border:1px solid rgba(255,138,128,.3)}
.status{display:inline-flex;align-items:center;gap:8px;margin:0 0 1.5rem;padding:6px 14px;border-radius:99px;background:#2c2f33;border:1px solid #3a3d42;color:#a8b3cf;font-size:.85rem}
.status .dot{width:6px;height:6px;border-radius:50%;background:#a8b3cf;animation:bounce 1.2s infinite ease-in-out}
.status .dot:nth-child(2){animation-delay:.2s}.status .dot:nth-child(3){animation-delay:.4s}
.status.ok{color:#7fdbca;border-color:rgba(127,219,202,.4)}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
.btn.busy .i{animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M2 2l20 20M8.5 16.4a5 5 0 0 1 7 0M2 8.8a15 15 0 0 1 4.2-2.6M10.7 5.1A15 15 0 0 1 22 8.8M5 12.9a10 10 0 0 1 5.2-2.7M15 11a10 10 0 0 1 4 1.9M12 20h.01"/></symbol><symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></symbol><symbol id="i-gamepad" viewBox="0 0 24 24"><path d="M6 12h4M8 10v4"/><path d="M15 13h.01M18 11h.01"/><path d="M17.3 5H6.7a4 4 0 0 0-3.9 3.2l-1.6 7.6A2.5 2.5 0 0 0 3.6 19c.7 0 1.3-.4 1.7-1l1.2-2h11l1.2 2c.4.6 1 1 1.7 1a2.5 2.5 0 0 0 2.4-3.2l-1.6-7.6A4 4 0 0 0 17.3 5z"/></symbol></svg>
<main>
  <a class="brand" href="/" aria-label="GameyFi home"><img src="/icons/icon-192.png" alt="" width="34" height="34"><span>Gamey<i>Fi</i></span></a>
  <div class="art" aria-hidden="true"><span></span><svg class="i"><use href="#i-wifi-off"/></svg></div>
  <h1>You're offline</h1>
  <p>GameyFi can't reach the network. Games you've opened before may still load. Otherwise, reconnect and try again.</p>
  <div class="status" id="st" role="status"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span id="stt">Waiting for connection</span></div>
  <div class="row">
    <button class="btn" id="retry" type="button"><svg class="i" aria-hidden="true"><use href="#i-refresh"/></svg>Try again</button>
    <a class="btn ghost" href="/"><svg class="i" aria-hidden="true"><use href="#i-gamepad"/></svg>Open saved games</a>
  </div>
</main>
<script>
(function(){
var b=document.getElementById('retry');
b.addEventListener('click',function(){b.classList.add('busy');setTimeout(function(){location.reload()},300)});
window.addEventListener('online',function(){
  var s=document.getElementById('st');s.className='status ok';s.textContent='Back online. Reloading';
  setTimeout(function(){location.reload()},600);
});
})();
</script>
</body>
</html>
