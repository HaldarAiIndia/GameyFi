<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7B2FFF">
<title>404 | GameyFi</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap" rel="stylesheet">
<style>
:root {
  --primary:      #7B2FFF;
  --bg:           #08080C;
  --surface:      #0e0e14;
  --border:       #23233a;
  --text:         #f0f0f8;
  --text-sub:     #8888aa;
  --font:         'Satoshi', sans-serif;
  --r-card:       1.35rem;
  --r-btn:        0.75rem;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 20px; overflow: hidden; position: relative;
}
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none;
  background-image: linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 48px 48px;
}
body::after {
  content: ''; position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 70% 55% at 50% -5%, rgba(123,47,255,0.14) 0%, transparent 65%);
}

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-card); padding: 32px 24px;
  max-width: 380px; width: 100%;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: 12px; position: relative; z-index: 1;
  box-shadow: 0 24px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(123,47,255,0.08);
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(123,47,255,0.6) 50%, transparent);
}

.num-404 {
  font-size: 4.5rem; font-weight: 900; line-height: 1;
  background: linear-gradient(135deg, #fff 0%, var(--primary) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: -0.05em;
}
h1 { font-size: 1.25rem; font-weight: 800; }
p { font-size: 0.85rem; color: var(--text-sub); line-height: 1.5; font-weight: 500; margin-bottom: 6px; }

code {
  font-family: monospace; font-size: 0.78rem;
  background: #09090b; border: 1px solid var(--border);
  padding: 4px 8px; border-radius: 6px; color: var(--primary);
  margin-bottom: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.btn {
  width: 100%; padding: 12px;
  background: linear-gradient(135deg, #9B3FFF 0%, #6615FF 60%, #4400DD 100%);
  color: #fff; border: none; border-radius: var(--r-btn);
  font-weight: 800; font-size: 0.88rem; cursor: pointer; text-decoration: none;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(123,47,255,0.35);
  transition: transform 0.18s, box-shadow 0.18s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 26px rgba(123,47,255,0.5); }
.btn:active { transform: scale(0.97); }
</style>
</head>
<body>
<div class="card">
  <div class="num-404">404</div>
  <h1>Game Not Found</h1>
  <p>The requested route does not exist or has not been deployed yet.</p>
  <code id="missingPath" hidden></code>
  <a class="btn" href="/">Return to Catalogue</a>
</div>
<script>
if (location.pathname !== '/') {
  var p = document.getElementById('missingPath');
  p.textContent = location.pathname;
  p.hidden = false;
}
</script>
</body>
</html>
